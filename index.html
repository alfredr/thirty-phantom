<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>30 Phantom Codys</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The manifest requests fullscreen display in landscape orientation when installed. -->
    <link rel="manifest" href="/web-manifest.json" />
    <meta name="theme-color" content="#0d0716" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Phantom Codys" />
    <style>
      html, body { margin: 0; height: 100%; background: #0d0716; overflow: hidden; }
      /* Absolute positioning keeps #app from creating a stacking context that puts the HUD below touch controls. */
      #app { position: absolute; inset: 0; }
      #app canvas { display: block; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
